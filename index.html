<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>專注鐘 · 番茄計時</title>
<meta name="description" content="極簡番茄鐘：25 分鐘專注、5 分鐘休息，可離線、可安裝，記錄今天完成了幾個循環。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12100d">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1713'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23d98f5a' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#12100d; --card:#1a1713; --line:rgba(255,255,255,.08);
    --txt:#efe9df; --dim:#a2988a; --dim2:#71695f;
    --focus:#d98f5a; --short:#7fc8a9; --long:#8aa8d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(900px 600px at 50% -12%, rgba(217,143,90,.16), transparent 62%), var(--bg);
    color:var(--txt); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh; padding:24px 18px;
    user-select:none; -webkit-user-select:none;
  }
  .head{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--dim);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
  .head i{width:8px;height:8px;border-radius:50%;background:var(--focus);box-shadow:0 0 0 4px rgba(217,143,90,.14)}

  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.04);padding:5px;border-radius:999px;border:1px solid var(--line);margin-bottom:26px}
  .tabs button{
    border:0;background:transparent;color:var(--dim);font:inherit;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer;
    transition:.18s;
  }
  .tabs button.on{background:rgba(255,255,255,.10);color:var(--txt)}

  .dial{position:relative;width:min(76vw,290px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:26px}
  .dial svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .dial circle{fill:none;stroke-linecap:round}
  .track{stroke:rgba(255,255,255,.07)}
  .prog{stroke:var(--focus);transition:stroke-dashoffset .4s linear, stroke .3s}
  .time{font-variant-numeric:tabular-nums;font-size:clamp(46px,15vw,64px);font-weight:300;letter-spacing:-.02em;line-height:1}
  .phase{margin-top:10px;font-size:12.5px;color:var(--dim2);letter-spacing:.12em;text-transform:uppercase}

  .ctrl{display:flex;gap:12px;align-items:center;margin-bottom:28px}
  .big{
    min-width:132px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);
    font:inherit;font-size:15px;font-weight:600;padding:14px 26px;cursor:pointer;transition:.18s;
  }
  .big:hover{background:rgba(255,255,255,.11)}
  .big.run{background:linear-gradient(180deg,#e2a06c,#c97a42);border-color:#b96e3a;color:#1b1208}
  .icon{
    width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--dim);
    font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.18s;
  }
  .icon:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}

  .stats{display:flex;gap:10px;width:100%;max-width:430px}
  .stat{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .stat b{display:block;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase}

  .foot{margin-top:26px;font-size:11.5px;color:var(--dim2);text-align:center;line-height:1.9;max-width:420px}
  .foot button{background:none;border:0;color:var(--dim);font:inherit;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);background:rgba(28,24,20,.96);
    border:1px solid rgba(255,255,255,.1);color:#f3ece2;font-size:13px;padding:11px 18px;border-radius:12px;
    opacity:0;transition:.24s;pointer-events:none;max-width:84vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="head"><i></i>FOCUS</div>

<div class="tabs" id="tabs">
  <button data-mode="focus" class="on">專注 25</button>
  <button data-mode="short">短休 5</button>
  <button data-mode="long">長休 15</button>
</div>

<div class="dial">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <circle class="track" cx="100" cy="100" r="92" stroke-width="6"></circle>
    <circle class="prog" id="ring" cx="100" cy="100" r="92" stroke-width="6" stroke-dasharray="578" stroke-dashoffset="0"></circle>
  </svg>
  <div style="text-align:center">
    <div class="time" id="time">25:00</div>
    <div class="phase" id="phase">準備開始</div>
  </div>
</div>

<div class="ctrl">
  <button class="icon" id="reset" title="重設">↺</button>
  <button class="big" id="toggle">開始</button>
  <button class="icon" id="skip" title="跳過">→</button>
</div>

<div class="stats">
  <div class="stat"><b id="done">0</b><span>今日循環</span></div>
  <div class="stat"><b id="mins">0</b><span>專注分鐘</span></div>
  <div class="stat"><b id="streak">0</b><span>連續天數</span></div>
</div>

<div class="foot">
  <span id="notifLine">需要提醒時，<button id="askNotif">開啟桌面通知</button></span><br>
  空白鍵開始／暫停 · 資料只存在這台裝置
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var DUR = { focus:25*60, short:5*60, long:15*60 };
  var NAMES = { focus:"專注中", short:"短休息", long:"長休息" };
  var COLORS = { focus:"#d98f5a", short:"#7fc8a9", long:"#8aa8d8" };

  var mode = "focus", left = DUR.focus, running = false, tickId = null, endAt = 0;
  var ring = document.getElementById("ring"), timeEl = document.getElementById("time"),
      phaseEl = document.getElementById("phase"), toggleBtn = document.getElementById("toggle"),
      toastEl = document.getElementById("toast");
  var CIRC = 2 * Math.PI * 92;

  /* ---- 統計（按日）---- */
  var KEY = "focus.stats.v1";
  function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function load(){
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){}
    if(!raw || raw.date !== today()){
      var prev = raw ? (raw.date || "") : "";
      var streak = 0;
      if(prev){
        var p = new Date(prev), t = new Date(today());
        var diff = Math.round((t - p) / 86400000);
        streak = (diff === 1 && (raw.done||0) > 0) ? (raw.streak||0) + 1 : 0;
      }
      raw = { date: today(), done:0, mins:0, streak: streak };
    }
    return raw;
  }
  var st = load();
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
  function paintStats(){
    document.getElementById("done").textContent = st.done;
    document.getElementById("mins").textContent = st.mins;
    document.getElementById("streak").textContent = st.streak;
  }

  /* ---- 顯示 ---- */
  function mmss(s){
    var m = Math.floor(s/60), sec = s%60;
    return (m<10?"0":"") + m + ":" + (sec<10?"0":"") + sec;
  }
  function paint(){
    timeEl.textContent = mmss(Math.max(0,left));
    var ratio = left / DUR[mode];
    ring.style.strokeDasharray = CIRC;
    ring.style.strokeDashoffset = CIRC * (1 - ratio);
    ring.style.stroke = COLORS[mode];
    document.querySelector('meta[name=theme-color]').setAttribute("content", mode==="focus" ? "#12100d" : "#101413");
    document.title = (running ? mmss(Math.max(0,left)) + " · " : "") + "專注鐘";
  }
  function setMode(m, silent){
    mode = m; left = DUR[m];
    document.querySelectorAll("#tabs button").forEach(function(b){
      b.classList.toggle("on", b.dataset.mode === m);
    });
    phaseEl.textContent = silent ? NAMES[m] : "準備開始";
    stop();
    paint();
  }

  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove("on"); }, 2600);
  }

  function beep(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      var ctx = new AC();
      [0, 0.18].forEach(function(delay){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
        g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.16);
        o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.18);
      });
    }catch(e){}
  }

  function notify(title, body){
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(title, { body: body, icon:"icons/icon-192.png", tag:"focus" }); } catch(e){}
  }

  function start(){
    running = true;
    toggleBtn.textContent = "暫停"; toggleBtn.classList.add("run");
    phaseEl.textContent = NAMES[mode];
    endAt = Date.now() + left * 1000;
    tickId = setInterval(function(){
      left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      paint();
      if(left === 0) finish();
    }, 250);
    paint();
  }
  function stop(){
    running = false;
    toggleBtn.textContent = left < DUR[mode] ? "繼續" : "開始";
    toggleBtn.classList.remove("run");
    if(tickId){ clearInterval(tickId); tickId = null; }
    paint();
  }
  function reset(){ left = DUR[mode]; stop(); phaseEl.textContent = "準備開始"; paint(); }

  function finish(){
    clearInterval(tickId); tickId = null; running = false;
    toggleBtn.textContent = "開始"; toggleBtn.classList.remove("run");

    if(mode === "focus"){
      st.done += 1; st.mins += 25; st.streak = Math.max(st.streak, 0); save(); paintStats();
      beep();
      notify("專注完成", "休息 5 分鐘，起來走一下。");
      toast("完成一個循環 · 休息一下");
      setMode(st.done % 4 === 0 ? "long" : "short");
    } else {
      beep();
      notify("休息結束", "回到專注吧。");
      toast("休息結束，開始下一個循環");
      setMode("focus");
    }
    left = DUR[mode];
    paint();
  }

  /* ---- 事件 ---- */
  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    setMode(b.dataset.mode);
  });
  toggleBtn.addEventListener("click", function(){ running ? stop() : start(); });
  document.getElementById("reset").addEventListener("click", reset);
  document.getElementById("skip").addEventListener("click", function(){
    if(confirm("跳過這一段？")){ if(mode === "focus") setMode("short", true); else setMode("focus", true); }
  });
  document.addEventListener("keydown", function(e){
    if(e.code === "Space"){ e.preventDefault(); running ? stop() : start(); }
    if(e.key.toLowerCase() === "r") reset();
  });

  var askBtn = document.getElementById("askNotif");
  function paintNotif(){
    if(!("Notification" in window)){ document.getElementById("notifLine").textContent = "此瀏覽器不支援桌面通知"; return; }
    if(Notification.permission === "granted"){ document.getElementById("notifLine").textContent = "桌面通知已開啟 ✓"; return; }
  }
  if(askBtn){
    askBtn.addEventListener("click", function(){
      Notification.requestPermission().then(function(p){
        if(p === "granted"){ paintNotif(); toast("通知已開啟"); }
        else { toast("未開啟通知，仍會有音效提示"); }
      });
    });
  }

  /* 回到前景時校正（避免背景被節流） */
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && running){ left = Math.max(0, Math.round((endAt - Date.now())/1000)); paint(); }
  });

  paintStats(); paintNotif(); paint();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
